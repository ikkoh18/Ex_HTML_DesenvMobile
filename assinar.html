<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABIT — Assinar Newsletter</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container">
      <span class="site-logo">HABIT</span>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="#">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html" aria-current="page">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-assinar" class="sr-only">Buscar</label>
        <input type="search" id="search-assinar" placeholder="Buscar..." aria-label="Buscar conteúdo" />
        <button type="button" class="btn-outline-sm">Buscar</button>
        <a href="entrar.html" class="btn-outline-sm">Entrar</a>
      </div>
    </div>
  </header>

  <main class="page-main" id="main-content">
    <div class="container">
      <div class="form-page-wrapper">
        <div class="form-box">
          <h1>Assine a newsletter</h1>

          <label for="email-newsletter" class="sr-only">E-mail</label>
          <input
            type="email"
            id="email-newsletter"
            class="form-field"
            placeholder="E-mail"
            autocomplete="email"
            required
          />

          <div class="form-checkbox">
            <input type="checkbox" id="privacy-newsletter" name="privacy" required />
            <label for="privacy-newsletter">
              Concordo em receber comunicações e li a
              <a href="#">política de privacidade</a>.
            </label>
          </div>

          <button type="button" class="btn-primary">Assinar</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a>
      <a href="#">Work</a>
      <a href="#">Bags</a>
      <a href="#">Lamp</a>
      <a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

</body>
</html>
