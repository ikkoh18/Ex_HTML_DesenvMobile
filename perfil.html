<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABIT — Perfil</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container">
      <span class="site-logo">HABIT</span>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="#">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-perfil" class="sr-only">Buscar</label>
        <input type="search" id="search-perfil" placeholder="Buscar..." aria-label="Buscar conteúdo" />
        <button type="button" class="btn-outline-sm">Buscar</button>
        <a href="entrar.html" class="btn-outline-sm">Entrar</a>
      </div>
    </div>
  </header>

  <main class="page-main" id="main-content">
    <div class="container">
      <div class="profile-layout">

        <!-- sidebar -->
        <aside class="profile-sidebar" aria-label="Dados do perfil">
          <h2>Perfil</h2>
          <div class="profile-avatar" role="img" aria-label="Foto de perfil"></div>

          <label for="perfil-nome" class="sr-only">Nome</label>
          <input type="text" id="perfil-nome" class="profile-field" placeholder="Nome" />

          <label for="perfil-bio" class="sr-only">Bio</label>
          <input type="text" id="perfil-bio" class="profile-field" placeholder="Bio" />

          <button type="button" class="btn-primary">Salvar</button>
        </aside>

        <!-- postagens -->
        <section class="profile-content" aria-labelledby="suas-postagens-title">
          <h2 id="suas-postagens-title">Suas Postagens</h2>

          <article class="profile-post-card">
            <div class="img-placeholder img-placeholder--sm" role="img" aria-label="Thumbnail post 1"></div>
            <div>
              <p class="post-status">Rascunho</p>
              <p class="post-title">Post 1</p>
            </div>
          </article>

          <article class="profile-post-card">
            <div class="img-placeholder img-placeholder--sm" role="img" aria-label="Thumbnail post 2"></div>
            <div>
              <p class="post-status">Publicado</p>
              <p class="post-title">Post 2</p>
            </div>
          </article>

          <article class="profile-post-card">
            <div class="img-placeholder img-placeholder--sm" role="img" aria-label="Thumbnail comentário 1"></div>
            <div>
              <p class="post-status">Em análise</p>
              <p class="post-title">Comentário 1</p>
            </div>
          </article>

          <article class="profile-post-card">
            <div class="img-placeholder img-placeholder--sm" role="img" aria-label="Thumbnail comentário 2"></div>
            <div>
              <p class="post-status">Publicado</p>
              <p class="post-title">Comentário 2</p>
            </div>
          </article>

        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a>
      <a href="#">Work</a>
      <a href="#">Bags</a>
      <a href="#">Lamp</a>
      <a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

</body>
</html>
