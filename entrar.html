<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABIT — Entrar</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container">
      <span class="site-logo">HABIT</span>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="#">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-login" class="sr-only">Buscar</label>
        <input type="search" id="search-login" placeholder="Buscar..." aria-label="Buscar conteúdo" />
        <button type="button" class="btn-outline-sm">Buscar</button>
        <a href="entrar.html" class="btn-outline-sm" aria-current="page">Entrar</a>
      </div>
    </div>
  </header>

  <main class="page-main" id="main-content">
    <div class="container">
      <div class="form-page-wrapper">
        <div class="form-box">
          <h1>Entrar</h1>

          <label for="email-login" class="sr-only">E-mail</label>
          <input
            type="email"
            id="email-login"
            class="form-field"
            placeholder="E-mail"
            autocomplete="email"
            required
          />

          <label for="senha-login" class="sr-only">Senha</label>
          <input
            type="password"
            id="senha-login"
            class="form-field"
            placeholder="Senha"
            autocomplete="current-password"
            required
          />

          <div class="form-actions">
            <button type="button" class="btn-primary">Entrar</button>
            <button type="button" class="btn-secondary">Entrar com Google</button>
          </div>

          <p class="form-links">
            <a href="#">Esqueci a senha</a> •
            <a href="criar-conta.html">Criar conta</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a>
      <a href="#">Work</a>
      <a href="#">Bags</a>
      <a href="#">Lamp</a>
      <a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

</body>
</html>
